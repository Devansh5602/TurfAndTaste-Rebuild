packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  typescript: 5.9.3
  zod: 4.6.5
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "@tanstack/react-query": 5.104.1
  "react-hook-form": 7.89.0
  "@hookform/resolvers": 5.9.1
  "date-fns": 4.1.0
  "date-fns-tz": 3.2.0

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - lucide-react@1.51.0
  - pino@10.4.0
  - turbo@2.11.7
  # Expo SDK 57 packages released inside the repo's minimum-release-age window.
  - "@expo/cli@57.0.28"
  - "@expo/config-plugins@57.0.10"
  - "@expo/config@57.0.10"
  - "@expo/image-utils@0.11.6"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/prebuild-config@57.0.17"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.12"
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - expo-linking@57.0.12

# pnpm 12 reads project settings from this file, not .npmrc. Metro resolves
# from the workspace-root node_modules, so the install must be hoisted.
nodeLinker: hoisted
